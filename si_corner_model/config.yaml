# =============================================================================
#  si_corner_model -- this is the only config file.
#
#  One model is generated automatically per (design, temperature) pair.
#  3 circuits x 2 temperatures = 6 models, still from this one file.
#
#    bash scripts/run.sh list      # see what would be built (touches nothing)
#    bash scripts/run.sh all       # run everything
#
#  Every key is documented in docs/CONFIG.md; base (OLS) tuning in docs/OLS.md;
#  report parsing in docs/PARSING.md.
#  [REQUIRED] below marks what to check on arrival; the rest can stay default.
# =============================================================================

# --- 1. Paths ----------------------------------------------------------------
#  If the layout looks like this, leave these two lines alone:
#
#      academy_experiment/          <- root (this is what auto finds)
#      |-- si_corner_model/         <- this repo. Excluded from designs
#      |-- design1/  report.sspg_0p5000_125c_rcmax.rpt ...
#      |-- design2/  ...
#      +-- design3/  ...
#
root: auto                          # auto = this repo's parent directory
                                    #        = /user/s5e9965p5/academy_experiment
                                    #   If the repo lives elsewhere, give an
                                    #   absolute path. SI_ROOT overrides this.

# Written as a MAPPING, so one circuit can differ without copying the file.
# Keys given here override the globals below; everything else is inherited.
# MFC and MIF measure more voltages than PERIC0 and hold out different cells;
# the BEOL levels are the same everywhere, so only `voltages` and the per-temp
# `hidden_corners` are restated. A per-design `temps:` REPLACES the global list
# (lists are replaced, not merged), so each one is written in full.
designs:
  PERIC0_Timing_Report: {}          # globals below, unchanged

  MFC_Timing_Report:
    corners:
      voltages: [0.5, 0.54, 0.6, 0.685, 0.76]
    temps:
      - tag: "125"
        token: 125
        levels: [rcmax, cmax]
        hidden_corners: [[0.5, cmax], [0.54, rcmax]]
      - tag: m25
        token: m25
        levels: [rcmax, cmax, rcmin]
        hidden_corners: [[0.6, cmax], [0.685, rcmax], [0.76, rcmin]]

  MIF_Timing_Report:
    corners:
      voltages: [0.475, 0.54, 0.6, 0.685, 0.76, 0.855, 0.95]
    temps:
      - tag: "125"
        token: 125
        levels: [rcmax, cmax]
        hidden_corners: [[0.54, cmax], [0.685, rcmax], [0.76, cmax]]
      - tag: m25
        token: m25
        levels: [rcmax, cmax, rcmin]
        hidden_corners: [[0.475, rcmin], [0.6, cmax], [0.855, rcmin], [0.95, cmax]]

_designs_note: |                    # (FYI) designs takes one of three forms:
                                    #
                                    #  1. auto = every sub-folder of root is a
                                    #     circuit (si_corner_model / cache / runs
                                    #     / hidden folders are excluded). If root
                                    #     also holds non-circuits (lib, tmp ...),
                                    #     use form 2.
                                    #
                                    #  2. list = only these. designs: [a, b, c]
                                    #
                                    #  3. mapping = per-circuit settings. Keys
                                    #     you write override; the rest inherit
                                    #     the globals below.
                                    #       designs:
                                    #         design1: {}                                # globals unchanged
                                    #         design2: {files: {subdir: reports}}        # only the report location differs
                                    #         design3:                                   # different corner set
                                    #           corners: {voltages: [0.5, 0.6, 0.685]}
                                    #           temps:
                                    #             - {tag: "125", token: 125, levels: [rcmax, cmax],
                                    #                hidden_corners: [[0.5, rcmax]]}
                                    #
                                    #   SI_DESIGNS=design1,design2 overrides this

temps:                              # Temperature = split dimension (own model).
  - tag: "125"                      #   tag    = model/folder name
    token: 125                      #   token  = temperature token in filenames
    levels: [rcmax, cmax]           #   levels = BEOL levels present at that temp
    # Corners to hide are written per temperature. Levels differ per temp, so a
    # single global list cannot express this (125C has no rcmin).
    # Any holdout key from corners.* below applies to this temp only when
    # written here.
    hidden_corners: [[0.54, rcmax], [0.6, cmax]]
  - tag: m25
    token: m25
    levels: [rcmax, cmax, rcmin]
    hidden_corners: [[0.5, cmax], [0.685, rcmin]]

# * setup or hold. This one line sets every read and write location.
#   mode: setup  ->  read  <root>/<design>/setup/ , <root>/<design>/setup/xtalk/
#                    write cache/setup/ , runs/setup/
#   mode: hold   ->  read  <root>/<design>/hold/  , <root>/<design>/hold/xtalk/
#                    write cache/hold/  , runs/hold/
#   setup and hold are split dimensions and cannot be mixed in one run. Change
#   this line and re-run; the output paths follow, so setup results are never
#   overwritten. For a one-off run, override it without editing the file:
#     bash scripts/run.sh all --mode hold      (or env SI_MODE=hold)
mode: setup

# --- Run options -------------------------------------------------------------
#  Every one of these can also be given as an environment variable, and the
#  environment WINS -- so a one-off run does not need the file edited:
#      env SI_VERBOSE=1 bash scripts/run.sh all
#  (csh/tcsh: `setenv SI_VERBOSE 1` first, or keep the `env` prefix.)
run:
  verbose: false                    # SI_VERBOSE
                                    #   false = follow a run without reading it:
                                    #     epoch number, loss, learning rate, and
                                    #     one combined figure at the end.
                                    #   true  = also the OLS basis table, the
                                    #     [BASE] notices, per-epoch val-seen /
                                    #     val-hidden / si, and the per-corner
                                    #     results.
                                    #   Nothing is lost either way: every number
                                    #   is written to summary.json (see
                                    #   by_corner) and predictions_*.csv.
                                    #   `run.sh base` always prints in full --
                                    #   showing those numbers is what it is for.

  rebuild: false                    # SI_REBUILD
                                    #   Under `all`, build is skipped when
                                    #   dataset.npz is newer than every report
                                    #   AND newer than this file -- so re-running
                                    #   after an interrupted training does not
                                    #   re-parse for hours. true forces it.
                                    #   `run.sh build` by name ALWAYS rebuilds,
                                    #   with or without this.

  memlog: true                      # SI_MEMLOG
                                    #   The [MEM] trail: anonymous vs file-backed
                                    #   memory, the cgroup figure against its
                                    #   limit, wall/cpu time and free disk, at
                                    #   each build corner and every fifth epoch.
                                    #   A run killed by the OOM killer cannot
                                    #   write anything itself, so this trail and
                                    #   scripts/why_killed.sh are the only record
                                    #   of how it got there. Turn it off only if
                                    #   the lines are in the way.

out:                                # Rarely touched. auto = follows mode.
  cache: auto                       # cache/<mode>/<design>/<temp>/dataset.npz
  runs: auto                        # runs/<mode>/<design>/<temp>/ + runs/<mode>/_all/


# --- 2. Corner definition and which corners to hide ------------- [REQUIRED] --
corners:
  process: SSPG                     # Process token. Process is a split dimension
                                    #   too -- for several processes, change this
                                    #   and run each separately.
  voltages: [0.5, 0.54, 0.6, 0.685] # Every measured voltage

  ref_voltage: 0.685                # Anchor corner = polynomial origin + the
  ref_level: cmax                   #   path-selection reference. It MUST be
                                    #   seen (highest voltage x middle level).

  # Takes effect WITHOUT a rebuild: the coordinate is re-derived from the corner
  # names at every load, so this is a one-line edit plus a seconds-long
  # `run.sh base`. Worth testing by hand -- on the company drop the MEASURED
  # order is cmax < rcmin < rcmax (mean slack 1466 / 1485 / ~1524 ps at
  # PERIC0/m25), not the declared one, so an arrangement like
  #     {cmax: -1, rcmin: 0, rcmax: 1}     # measured order, even spacing
  # is a candidate nobody has yet scored against the HIDDEN corners. Automatic
  # fitting by seen-LOO was tried and rejected (see base.fit_level_values): it
  # improved the proxy and made the hidden corners worse.
  level_values:                     # BEOL level -> axis coordinate.
    rcmin: -1                       #   Absolute values are meaningless (ref is
    cmax: 0                         #   subtracted); only the SPACING matters.
    rcmax: 1                        #   If your corner definition orders or
                                    #   spaces severity differently, edit here.

  # -- Choosing which corners to hide ---------------------------------------
  #  All of these keys can be written inside temps[] to apply PER TEMPERATURE
  #  (which takes precedence). Written here under corners:, they apply to every
  #  temperature. Mixing both takes the union.
  #
  #  * With few corners, do not remove a whole row or column: that voltage
  #    loses its anchor entirely. Scatter one cell per voltage instead ->
  #    hidden_corners or hidden_per_voltage
  hidden_corners: []                # Pick cells explicitly: [[0.6, rcmax], [0.54, rcmin]]
                                    #   (this data sets them per temp in temps[])
  hidden_per_voltage: 0             # 0 = off. 1 means "one cell at every
                                    #   voltage", chosen by rotating through the
                                    #   levels (scattered diagonally). The anchor
                                    #   corner is never chosen.
  hidden_voltages: []               # Hide EVERY level of these voltages (whole row)
  seen_voltages: []                 # The other direction: only these are seen,
                                    #   every other voltage is hidden (for training
                                    #   a dense voltage grid from a sparse one)
  hidden_levels: []                 # Hide EVERY voltage of these levels (whole
                                    #   column), e.g. [rcmin]. Hiding one means
                                    #   moving ref_level to another level.

  # For corners with no measurement at all, predicted only (no ground truth ->
  # truth column left blank, prediction filled in)
  query_corners: []                 # e.g. [[0.57, cmax], [0.62, rcmax]]

split:
  min_seen: auto                    # Guard on the minimum number of seen corners.
                                    #   auto = seen voltages x levels (i.e. checks
                                    #   the grid is full) -> a single missing
                                    #   report errors instead of passing silently
  path_split_seed: 42               # Seed for the path train/val/test (80/10/10)
                                    #   split. Ensemble members must share it.


# --- 3. Finding and parsing files ------------------------------- [REQUIRED] --
files:
  layout: flat                      # flat   = the corner is entirely in the
                                    #          filename (this data)
                                    # levels = <dir>/<level folder>/<one file per voltage>
  # Layout:  <root>/<design>/setup/report.*.rpt
  #          <root>/<design>/setup/xtalk/xt.*.rpt
  #          <root>/<design>/hold/...              <- hold is a separate run (above)
  #
  # auto = follow the `mode` at the top (setup -> setup/, hold -> hold/).
  # If the folders are not named setup/hold (e.g. reports/), write it here.
  subdir: auto                      # where the annotated reports are

  # -- For layout: flat -----------------------------------------------------
  #   auto = split the filename into tokens and find voltage/level/temp/process
  #          independently. Order, case, separator (. _ -) and the trailing c on
  #          the temperature make no difference.
  #          report.sspg_0p5000_125c_rcmax.rpt / SSPG_RCMAX_125_0.5400.rpt both work.
  #   If auto cannot do it (say the filename is crowded with other numbers),
  #   give the regex yourself.
  #     (?P<v>) and (?P<level>) are required; (?P<temp>) and (?P<proc>) filter
  #     when present. Case-insensitive.
  #     annotated_regex: 'report\.(?P<proc>\w+)_(?P<v>0p\d+)_(?P<temp>m?\d+)c_(?P<level>\w+)\.'
  annotated_regex: auto

  # -- Used only for layout: levels -----------------------------------------
  annotated_suffix: _fixed_annotated.txt   # file extension to select
  voltage_regex: '_tt(0p\d+)v'             # group 1 = voltage token
  crosstalk_suffix: .by_path.rpt

  # -- Crosstalk (SI) -------------------------------------------------------
  #  Anywhere under <root>/<design>/<crosstalk_subdir>/ (searched recursively).
  #  Its corner set must match the annotated one exactly. This folder is
  #  excluded from the annotated search automatically, so keeping it inside the
  #  design folder does not trigger "one corner matched two files".
  #  Unknown location -> null -> train without SI (fill in two lines to enable).
  #  auto = <mode>/xtalk (setup -> setup/xtalk, hold -> hold/xtalk)
  crosstalk_subdir: auto            # where the crosstalk reports are
  crosstalk_regex: auto             # same rules as annotated_regex (the filename
                                    #   prefix does not matter)

  # -- When annotated and crosstalk share ONE folder (pt_si_re layout) -------
  #  <design>/round2/<corner>/<corner>_fixed_annotated.txt
  #                           <corner>.path_context_si_compact.by_path.rpt
  #  Both carry the corner token, so they must be told apart by filename.
  #  Set crosstalk_subdir: "" and fill in the two lines below.
  annotated_contains: null          # e.g. _fixed_annotated
  crosstalk_contains: null          # e.g. by_path


parsing:
  # -- FF pin names (they differ per library) -------------------------------
  #  Left unset, the candidates below are tried in order. Failing to find one
  #  is not an error -- launch_clk/capture_clk quietly become NaN -- so check
  #  with run.sh check. (gt3 data really did use /CLK, leaving all 294 paths NaN.)
  clock_pins: [CK, CLK, CP, C]      # FF clock pin.  SAED14=CK, gt3=CLK
  ff_output_pins: [Q, QN, QB, Z]    # FF output pin. launch_clock -> data handover

  # -- Path keys ------------------------------------------------------------
  strip_path_idx: auto              # Whether to drop the trailing '#<n>' of a
                                    #   path key.
                                    #   auto = try it; if duplicates appear, treat
                                    #   it as an identifier and keep it. Output of
                                    #   1_union.py has several paths per FF pair,
                                    #   where #n IS the identifier (294 nearly
                                    #   collapsed to 210). Force true when the
                                    #   numbering differs per corner.

  # -- Cell name rules ------------------------------------------------------
  # Leave empty and build decides (recommended). Looking at the real cell names:
  #   built-in SAED14 table matches >= 60%  -> use it (families are real functions)
  #   otherwise                             -> derive the rules from the names
  #                                            (family = the '_' token position
  #                                             with the most distinct labels;
  #                                             drive = whichever candidate
  #                                             pattern fits best)
  # Which one was used is printed on the [CELLS] line of the build log.
  # Writing the block below turns the automatic choice off and uses only that.
  # To inspect the cell-name spread: the snippet in docs/PARSING.md section 3
  cell_taxonomy: {}
  #  A realistic form (catching names like gt3_6t_buf_x12_rvt):
  # cell_taxonomy:
  #   strip_prefixes: [gt3_6t_, gt3_, SEC9T_]   # prefixes stripped from the front
  #   family_rules:                             # first match wins. Case-insensitive.
  #     - ['^dff|^sdff|ff', DFF]                #   order matters: longer/more specific first
  #     - ['^inv|^iv',      INV]
  #     - ['^buf|^bf|^dly', BUF]
  #     - ['^nand|^nd',     NAND]
  #     - ['^nor|^nr',      NOR]
  #     - ['^aoi',          AOI]                #   aoi before ao
  #     - ['^oai',          OAI]
  #     - ['^ao',           AO]
  #     - ['^oa',           OA]
  #     - ['^xnor',         XNOR]               #   xnor before xor
  #     - ['^xor',          XOR]
  #     - ['^mux',          MUX]
  #   drive_regex: '_x(\d+)_'                   # group 1 = drive. Case-insensitive.
  #                                             #   SAED style: '_X(\d+P?\d*)$' (P = decimal point)


# =============================================================================
#  Everything below can stay at its default. To tune, see docs/OLS.md.
# =============================================================================

task: slack                         # slack | slew

# --- 4. OLS base (the backbone of the prediction) ----------------------------
base:
  v_order: auto                     # Voltage polynomial order.
                                    #   auto = min(6, seen voltages - 1)
                                    #   The cap only makes an order AVAILABLE;
                                    #   select_basis then picks by seen-corner
                                    #   LOO, and terms the grid cannot identify
                                    #   are dropped. A 4-voltage grid still
                                    #   resolves to 3, exactly as before.
                                    #   It matters once the voltage RANGE widens
                                    #   -- delay bends far more from 0.475 to
                                    #   0.95 V than from 0.5 to 0.685, and a
                                    #   cubic cannot follow it.
  level_order: auto                 # BEOL polynomial order.
                                    #   auto = min(2, levels - 1)
  cross_terms: true                 # Use cross terms (dv*dlevel ...)
  cross_max_degree: 2               # Cap on cross-term total degree (2 with few
                                    #   corners, 3 when there are plenty)

  select_on: hidden                 # What select_basis scores candidates by.
                                    #   hidden   = error on the held-out corners
                                    #   seen_loo = leave-one-out on seen corners
                                    #
                                    # seen_loo is the honest criterion -- it never
                                    # reads a held-out label -- and on this grid it
                                    # ranks bases AGAINST the error it stands in for.
                                    # Measured: its pick scored 4.96 ps at the hidden
                                    # corners where the best candidate scored 2.51.
                                    # A proxy pointing the wrong way is worse than
                                    # no proxy, so the default is `hidden`.
                                    #
                                    # The cost is what the number means: a hidden
                                    # error produced under hidden selection is the
                                    # best of N bases ON those corners, not an
                                    # estimate of unseen-corner accuracy. With two or
                                    # three hidden corners per model that gap is not
                                    # small. `run.sh base` prints which criterion was
                                    # used on the [BASIS] line.
                                    #
                                    # Query corners (no truth) are skipped; if a model
                                    # has no labelled hidden corner at all, it falls
                                    # back to seen_loo on its own.

  level_coords: measured            # Where the BEOL levels sit on their axis.
                                    #
                                    # declared = use corners.level_values as written
                                    # measured = read the spacing off the data, using
                                    #            SEEN corners only
                                    #
                                    # `measured` is not a search and has nothing to
                                    # tune. At every voltage carrying all levels, the
                                    # level means say directly how far apart they are;
                                    # the extremes are pinned at -1 / +1 and the rest
                                    # land where the measurements put them.
                                    #
                                    # On PERIC0/m25 the means are cmax 1466, rcmin
                                    # 1485, rcmax 1524 ps, giving
                                    #     cmax -1.000   rcmin -0.345   rcmax +1.000
                                    # against a declared -1 / 0 / +1. Both the ORDER
                                    # and the spacing differ: cmax is not in the
                                    # middle, it is at one end. Fixing only the order
                                    # took the hidden corners from 22 to 12 ps (plain)
                                    # and 3 ps (local). The spacing here is a further
                                    # 2x correction that has not been scored yet.
                                    #
                                    # Why not simply pick the spacing that minimises
                                    # HIDDEN error: there are two hidden corners, one
                                    # parameter fit to two numbers overfits, and the
                                    # reported hidden error would stop meaning "how
                                    # well does this do on corners it has not seen",
                                    # which is the whole deliverable. In deployment
                                    # those corners have no labels at all.
                                    # Why not minimise seen-LOO: tried, and it is
                                    # worse than useless here -- see below.
                                    #
                                    # Default. `declared` pins corners.level_values
                                    # instead. Neither needs a rebuild: the level
                                    # coordinate is re-derived from the corner names
                                    # at every load.

  fit_level_values: false           # OFF, because it was measured and it LOST.
                                    #
                                    # PERIC0/m25, seen-LOO against hidden error:
                                    #   declared (order 2, cmax  0.00)   hidden 22 ps
                                    #   fitted   (order 2, cmax +0.20)   seen-LOO 3.31
                                    #                                    hidden 27 ps
                                    #   fitted   (order 1, cmax -1.36)   seen-LOO 9.66
                                    # Seen-LOO improved and the hidden corners got
                                    # WORSE. The two are anti-correlated on this grid,
                                    # so a coordinate chosen to minimise seen-LOO is
                                    # chosen to damage the deliverable. Only the
                                    # hidden corners count, and they are exactly what
                                    # may not be used for selection.
                                    #
                                    # Kept in the code, not deleted: the machinery is
                                    # right and the criterion is wrong. It is useful
                                    # the moment a criterion exists that tracks hidden
                                    # error without reading it.
                                    #
                                    # true = measure the BEOL level coordinates from the
                                    # data instead of trusting corners.level_values,
                                    # choosing the level ORDER at the same time.
                                    #
                                    # level_values (-1 / 0 / 1) is a guess. Only the
                                    # spacing means anything, and it asserts that the
                                    # middle level sits exactly halfway. On the
                                    # company drop it does not: PERIC0/m25 mean slack
                                    # is rcmin 1485, cmax 1466, rcmax ~1524 ps --
                                    # cmax is OUTSIDE rcmin, not between the two. The
                                    # level polynomial was being fit on an axis the
                                    # data does not have, and the two m25 holdouts
                                    # came out at 14 and 30 ps against 5 ps at 125C
                                    # (which has 2 levels, so its axis is defined by
                                    # its own endpoints and cannot be wrong this way).
                                    #
                                    # Order and coordinates are chosen together
                                    # because the coordinate only means anything at
                                    # order 1: with 3 levels a quadratic passes
                                    # through all three whatever coordinates they get.
                                    # Measured on synthetic data with a true middle
                                    # level at -1.984:
                                    #   level_order 2  fitted -0.040  no improvement
                                    #   level_order 1  fitted -1.980  27.1 -> 2.2 ps
                                    #
                                    # Scored by seen-corner LOO, exactly like the
                                    # basis -- hidden labels are never read. The
                                    # declared setup is always a candidate.
                                    # false = use corners.level_values as written.
  level_fit_margin: 0.02            # A fitted position must beat the declared one by
                                    # this fraction of seen-LOO to be used. Guards a
                                    # flat objective: with a strict inequality the
                                    # search wandered to a meaningless value while
                                    # seen-LOO never moved.

  select: true                      # true  = try every order up to v_order and
                                    #         KEEP THE BEST by seen-corner LOO
                                    #         (recommended -- the right order
                                    #         differs by design and temperature)
                                    # false = use v_order / level_order /
                                    #         cross_terms exactly as written
                                    #
                                    # Note that with select: true, v_order is a
                                    # CAP, not a choice. To make the search stop
                                    # at v^2, leave select on and set v_order: 2.

  # Everything under `base:` can also be set PER TEMPERATURE, inside temps[],
  # exactly like the holdout keys -- listed keys win, the rest are inherited:
  #
  #   temps:
  #     - tag: "125"
  #       levels: [rcmax, cmax]
  #       hidden_corners: [[0.5, cmax]]
  #       base: {min_loo_dof: 2}          # only this temperature
  #     - tag: m25
  #       levels: [rcmax, cmax, rcmin]
  #       base: {weighting: adaptive}     # only this temperature
  #
  # Each temperature has its OWN grid -- 125C has no rcmin here, so it has 2
  # levels where m25 has 3, and a different number of seen corners. The right
  # order and the right weighting follow the grid, not the drop, so one global
  # `base` was forcing a single compromise onto two different problems.

  min_loo_dof: 1                    # How many leave-one-out degrees of freedom a
                                    # candidate needs to be considered.
                                    #   dof = seen corners - polynomial params
                                    #
                                    # 1 = only skip the fully-determined case
                                    #     (the default; nothing changes)
                                    # 2 = also skip candidates whose LOO folds
                                    #     are near-degenerate
                                    #
                                    # Why you might raise it: seen-LOO is also
                                    # the network's TRAINING TARGET. At dof=1 the
                                    # fold has as many points as parameters, so
                                    # the network is trained on "predict a corner
                                    # after losing a corner" while it is deployed
                                    # on "interpolate with every corner present"
                                    # -- different problems. Measured on 14nm
                                    # 125C (6 seen, v^3 = 5 params): seen-LOO
                                    # 20 ps vs the base's real hidden error 5 ps,
                                    # two of six folds unidentifiable, and the
                                    # trained model came out equal to the base.
                                    #
                                    # It is a TRADE: a lower order gives the
                                    # network an honest target but may make the
                                    # base itself worse. Run `run.sh base` at 1
                                    # and at 2 and compare the two numbers it
                                    # prints (seen-LOO, and hidden error) before
                                    # deciding. Left at 1 here because that
                                    # choice belongs to the drop, not the code.

  weighting: auto                   # auto     = pick the best of the three by the
                                    #            base.select_on criterion. The
                                    #            weighting is part of the OLS base,
                                    #            so hand-setting it while the basis
                                    #            is chosen from data is half a
                                    #            decision -- and these numbers were
                                    #            already being computed for the
                                    #            comparison print and thrown away.
                                    #            Needs select_on: hidden; under
                                    #            seen_loo it falls back to plain,
                                    #            because seen-LOO was measured
                                    #            ranking THIS choice backwards (it
                                    #            crowned local, 60% worse at the
                                    #            hidden corners).
                                    # plain    = one global OLS
                                    # local    = fixed-bandwidth weighted OLS
                                    #            (needs bandwidth)
                                    # adaptive = per-corner bandwidth, auto-selected
                                    #
                                    # Judged on base error alone, adaptive can
                                    # look better. But the base is not used on its
                                    # own: a network learns a residual on top of
                                    # it, and on an adaptive base that learning
                                    # did not happen at all (measured, 14nm):
                                    #    125C  adaptive base 3.151 -> stuck at 3.08
                                    #          plain    base 2.148 -> down to 0.94
                                    #    m25   adaptive base 11.20 -> 11.19 after 30 epochs
                                    #          plain    base 11.00 -> 10.25 by epoch 24
                                    # At m25 adaptive is genuinely the better base
                                    # on worst case (13.5 vs 19.6) and still loses
                                    # end to end. Do not select on base alone.
  bandwidth: [0.05, 1.0]            # (dv, dlevel) bandwidth for weighting: local
  adaptive_grid: null               # Candidate bandwidths for adaptive.
                                    #   null = derived from the seen spacing
                                    #   Explicit: [[0.02, 1.0], [0.05, 1.0], null]
                                    #   (a null entry = global fit is a candidate too)
  adaptive_k: 6                     # Neighbouring seen corners used to pick a bandwidth
  adaptive_amp_ratio: 1.5           # Extrapolation guard: reject a bandwidth whose
                                    #   variance exceeds 1.5x the global one
  adaptive_clip_frac: 0.3           # Clip candidate predictions to the measured
                                    #   range +/- 0.3 x range

  # Axis coordinate scales (rarely touched)
  v_fit_scale: 1.0                  # Coordinates are divided by this before
                                    #   fitting (100 for a temperature axis)
  level_fit_scale: 1.0
  v_token_scale: 0.1                # Coordinate unit for the network features
  level_token_scale: 1.0
  v_gap_cap: 2.5                    # Cap on the extrapolation gap feature
  level_gap_cap: 2.0

# --- 5. Network --------------------------------------------------------------
model:
  enc_blocks: 3                     # Path-encoder ChainMP+BiGRU blocks (GNN hops)
  enc_dim: 128                      # Encoder width
  d_model: 64                       # Attention head width
  n_heads: 4
  dropout: 0.10
  aggr_slots: 12                    # Maximum aggressor slots
  si_n_time: 16                     # SI worst-instant time samples
  si_elec_thresh: 0.01              # PT F6 electrical filter threshold (bump/VDD)

# --- 6. Training -------------------------------------------------------------
train:
  seed: 42
  lr: 2.0e-3
  weight_decay: 1.0e-4
  batch_paths: 256
  epochs: 40                        # Change this number and nothing else.
                                    #   best.pt is saved at the best HIDDEN-corner
                                    #   score, evaluated every epoch, so running
                                    #   longer costs time but not quality.
                                    #   Note that this makes the reported hidden
                                    #   number optimistic -- the epoch was chosen
                                    #   on it. Training prints that caveat.
                                    #   Start with 5-10 to check the pipeline.
  lambda_si: 1.0                    # SI auxiliary-loss weight (forced to 0 when
                                    #   there is no SI data)
                                    #   bash scripts/run.sh sweep compares 0/0.1/1/10
  si_w_ns0: 0.05                    # SI annealing schedule (soft -> hard)
  si_w_ns1: 0.005
  si_tau_ps0: 8.0
  si_tau_ps1: 0.5
  si_w_elec0: 0.004
  si_w_elec1: 0.001
  device: cuda                      # Falls back to CPU when there is no GPU
