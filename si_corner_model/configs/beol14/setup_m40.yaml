# 14nm SmallBoomV2 (BoomCore) -- SETUP, temp = m40C, SI-on.
# Corner grid: 17 V x 3 RC = 51. Temperature is SPLIT (this is the m40 model);
# the two continuous OLS axes are voltage and RC (BEOL: Cmin/Cnom/Cmax).

data:
  annotated_dir: /home/hyunss/PVT_prediction/14nm/iter51/annotation/setup_sion/temp_m40/annotated
  crosstalk_dir: /home/hyunss/PVT_prediction/14nm/iter51/crosstalk/newsetup
  temp: m40                       # picks the m40 crosstalk files
  rc_corners: [Cmin, Cnom, Cmax]  # the level sub-folder names in the data (any names)
  ref_corner: TT_0p8V_Cnom        # path-selection anchor; must stay seen
  cache: cache/beol14/setup_m40/dataset.npz
  # patterns: {}  # override annotated_suffix / crosstalk_suffix / voltage_regex for a different report format

split:
  # SEEN = coarse 0.025 V grid; HIDDEN = the fine in-between V corners (all RC).
  seen_voltages: [0.6, 0.625, 0.65, 0.675, 0.7, 0.725, 0.75, 0.775, 0.8]
  hidden_rc: []                   # [] = all RC seen (hold RC out here + move ref off Cnom)

base:
  axes:
    - {name: v,  ref: 0.8, order: 3}    # cubic in V
    # RC (BEOL) second axis. `levels` maps the sub-folder/label names to axis
    # coordinates -- rename these freely for another vendor (Cbest/Ctyp/Cworst,
    # numeric parasitic scales, ...). Omit `levels` to use the Cmin/Cnom/Cmax default.
    - {name: rc, ref: 0.0, order: 2, levels: {Cmin: -1, Cnom: 0, Cmax: 1}}   # 3 levels -> quadratic cap
  # bandwidths in (dv volts, drc raw) units; null = global fit (also the amp reference)
  adaptive_grid: [[0.02, 1.0], [0.03, 1.0], [0.05, 1.0], [0.08, 1.0],
                  [0.05, 2.0], [0.08, 2.0], [0.12, 2.0], null]

train:
  out_dir: runs/beol14/setup_m40/v1
