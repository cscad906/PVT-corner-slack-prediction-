# 14nm SmallBoomV2 -- HOLD, temp = m40C, SI-on.
# Same V x RC grid as setup; hold uses the `newhold` crosstalk (min-direction
# deltas) and the hold library check. ~10000 paths/corner.
data:
  annotated_dir: /home/hyunss/PVT_prediction/14nm/iter51/annotation/hold_sion/temp_m40/annotated
  crosstalk_dir: /home/hyunss/PVT_prediction/14nm/iter51/crosstalk/newhold
  temp: m40
  rc_corners: [Cmin, Cnom, Cmax]
  ref_corner: TT_0p8V_Cnom
  cache: cache/beol14/hold_m40/dataset.npz

split:
  seen_voltages: [0.6, 0.625, 0.65, 0.675, 0.7, 0.725, 0.75, 0.775, 0.8]
  hidden_rc: []

base:
  axes:
    - {name: v,  ref: 0.8, order: 3}
    - {name: rc, ref: 0.0, order: 2}
  adaptive_grid: [[0.02, 1.0], [0.03, 1.0], [0.05, 1.0], [0.08, 1.0],
                  [0.05, 2.0], [0.08, 2.0], [0.12, 2.0], null]

train:
  out_dir: runs/beol14/hold_m40/v1
