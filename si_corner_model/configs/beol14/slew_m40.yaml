# 14nm SmallBoomV2 -- SLEW prediction, temp = m40C. Corner grid 17 V x 3 RC = 51.
# Slew model = per-corner weighted-OLS base + neural residual, NO SI branch (slew
# has no crosstalk-delta label) and NO cell/net stage head. CAP is not trained --
# fetched from a same-RC neighbour (V-independent). Metric = MAPE (%).
data:
  annotated_dir: /home/hyunss/PVT_prediction/14nm/iter51/annotation/setup_sion/temp_m40/annotated
  temp: m40
  rc_corners: [Cmin, Cnom, Cmax]
  ref_corner: TT_0p8V_Cnom
  cache: cache/beol14/slew_m40/slew.npz

split:
  seen_voltages: [0.6, 0.625, 0.65, 0.675, 0.7, 0.725, 0.75, 0.775, 0.8]
  hidden_rc: []

base:
  axes:
    - {name: v,  ref: 0.8, order: 3}
    - {name: rc, ref: 0.0, order: 2}
  adaptive_grid: [[0.02, 1.0], [0.03, 1.0], [0.05, 1.0], [0.08, 1.0],
                  [0.05, 2.0], [0.08, 2.0], [0.12, 2.0], null]

train:
  out_dir: runs/beol14/slew_m40/v1
