# Shared defaults, deep-merged UNDER every per-model config by config.load_config.
# A per-model YAML only needs to state what differs (data paths, axes, splits).

model:
  enc_blocks: 3                   # ChainMP+BiGRU blocks (GNN hops); 2/3/4/5 sweep -> 3
  d_model: 64
  n_heads: 4
  dropout: 0.10
  aggr_slots: 12                  # union-of-active aggressor max
  si_n_time: 16                   # SI worst-instant sweep samples
  si_elec_thresh: 0.01            # F6 electrical filter threshold on interpolated bump ratio

base:
  # Fit mode for the per-path OLS base:
  #   plain    -> one global OLS fit
  #   local    -> fixed-bandwidth locally-weighted OLS (the "가중 OLS")
  #   adaptive -> per-corner bandwidth selection (best; label-free)
  weighting: adaptive
  cross_terms: true               # include mixed terms (dv*d<axis1>, ...)
  cross_max_degree: 3             # cap on total degree of cross terms
  adaptive_k: 6                   # kNN neighbours for label-free bandwidth pick
  adaptive_amp_ratio: 1.5         # extrapolation guard: reject kernels with variance > 1.5x global
  adaptive_clip_frac: 0.3         # clip candidate fields to [min,max] +/- 0.3*range
  # `adaptive_grid` (per-axis bandwidth candidates, incl. `null` = global) is
  # dataset-specific and set per config; omit it to auto-derive from seen spacing.

train:
  seed: 42
  lr: 2.0e-3
  weight_decay: 1.0e-4
  batch_paths: 256
  epochs: 100
  lambda_si: 1.0                  # SI aux-loss weight; sweep [0, 0.1, 1, 10]
  si_w_ns0: 0.05
  si_w_ns1: 0.005
  si_tau_ps0: 8.0
  si_tau_ps1: 0.5
  si_w_elec0: 0.004
  si_w_elec1: 0.001
  device: cuda
