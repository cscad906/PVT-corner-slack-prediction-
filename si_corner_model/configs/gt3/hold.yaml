# 3nm BoomCoreV3 -- HOLD SI-aware corner prediction.
# NOTE: the original 3nm hold crosstalk dump was made WITHOUT `-min`, so it holds
# max/setup-direction deltas (wrong sign+magnitude for hold). Rebuild the hold
# crosstalk with `report_delay_calculation -crosstalk -min` before trusting this;
# the engine itself is identical to setup.
data:
  annotated_dir: /home/hyunss/PVT_prediction/3nm/deliver/annotation/hold_si/annotated
  crosstalk_dir: /home/hyunss/PVT_prediction/3nm/deliver/real_crosstalk/last_real_hold
  ref_corner: TT_0p7V_25C
  cache: cache/gt3/hold/dataset.npz

split:
  hidden_voltages: [0.75]
  hidden_temps: [70]

base:
  axes:
    - {name: v, ref: 0.7, order: 3}
    - {name: t, ref: 25, order: 4, fit_scale: 100, token_scale: 100}
  adaptive_grid: [[0.03, 0.30], [0.05, 0.35], [0.05, 0.45], [0.08, 0.45],
                  [0.12, 0.45], [0.08, 0.80], [0.12, 0.80], null]

train:
  out_dir: runs/gt3/hold/v1
