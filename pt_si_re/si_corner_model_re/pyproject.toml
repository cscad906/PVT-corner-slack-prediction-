[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "si-corner-model"
version = "0.1.0"
description = "SI-aware per-path timing prediction at unmeasured (V, BEOL/RC) corners: per-path weighted OLS base + gated set-invariant attention + SI branch. Temperature / process / setup-hold are split into separate models."
requires-python = ">=3.9"
dependencies = ["numpy", "pyyaml"]

[project.optional-dependencies]
# training/inference needs torch; the parsers + OLS base need only numpy.
train = ["torch"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["si_model*"]
